@let isHandset = this.isHandset();

@if (auth.usuario(); as usuario) {
  <mat-sidenav-container class="sidenav-container">

    <mat-sidenav
      #drawer
      class="sidenav"
      fixedInViewport
      [attr.role]="isHandset ? 'dialog' : 'navigation'"
      [mode]="isHandset ? 'over' : 'side'"
      [opened]="!isHandset">

      <mat-toolbar>
        Menu
      </mat-toolbar>

      <mat-nav-list>

        <a mat-list-item routerLink="/clientes">
          Perfil
        </a>

        <a mat-list-item routerLink="/catalogo">
          Catalogo
        </a>

        <a mat-list-item routerLink="/compras">
          Compras
        </a>

        <a mat-list-item routerLink="/contacto">
          Contactanos
        </a>

      </mat-nav-list>

    </mat-sidenav>

    <mat-sidenav-content>

      <mat-toolbar>

        @if (isHandset) {
          <button
            type="button"
            aria-label="Toggle sidenav"
            matIconButton
            (click)="drawer.toggle()">

            <mat-icon>
              menu
            </mat-icon>

          </button>
        }

        <a routerLink="/inicio">
          GH autos
        </a>

        <span class="espaciador"></span>

        <span class="nombre-usuario">{{ usuario.nombre }}</span>
        <button matButton type="button" (click)="cerrarSesion()">Cerrar sesión</button>

      </mat-toolbar>

      <router-outlet></router-outlet>

    </mat-sidenav-content>

  </mat-sidenav-container>
} @else {
  <router-outlet></router-outlet>
}
