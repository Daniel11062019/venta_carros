<div class="pagina">
  <mat-card>
    <mat-card-title>Crear cuenta</mat-card-title>

    <mat-card-content>
      <form [formGroup]="formRegistro" (ngSubmit)="registrarse()">
        <!-- NOMBRE -->
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>

          <input matInput formControlName="nombre" />

          <mat-error *ngIf="formRegistro.get('nombre')?.hasError('required')">
            El nombre es obligatorio
          </mat-error>
        </mat-form-field>

        <!-- EMAIL -->
        <mat-form-field appearance="outline">
          <mat-label>Correo</mat-label>

          <input matInput type="email" formControlName="email" />

          <mat-error *ngIf="formRegistro.get('email')?.hasError('required')">
            El correo es obligatorio
          </mat-error>

          <mat-error *ngIf="formRegistro.get('email')?.hasError('email')">
            Correo no válido
          </mat-error>
        </mat-form-field>

        <!-- PASSWORD -->
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>

          <input matInput type="password" formControlName="password" />

          <mat-error *ngIf="formRegistro.get('password')?.hasError('required')">
            La contraseña es obligatoria
          </mat-error>

          <mat-error *ngIf="formRegistro.get('password')?.hasError('minlength')">
            Mínimo 8 caracteres
          </mat-error>
        </mat-form-field>

        <!-- BUTTON -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
        >
          Registrarme
        </button>
      </form>

      <p class="cambiar">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </mat-card-content>
  </mat-card>
</div>
