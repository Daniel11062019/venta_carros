<div class="pagina">
  <!-- Círculos de adorno del fondo -->
  <div class="burbuja burbuja-1"></div>
  <div class="burbuja burbuja-2"></div>

  <mat-card>
    <!-- MARCA -->
    <div class="marca">
      <div class="marca-icono">
        <mat-icon>directions_car</mat-icon>
      </div>
      <p class="marca-texto">GH <span>Autos</span></p>
    </div>

    <mat-card-title>Iniciar sesión</mat-card-title>
    <p class="subtitulo">Bienvenido de nuevo, ingresa tus datos</p>

    <mat-card-content>
      <form [formGroup]="formLogin" (ngSubmit)="login()">
        <!-- EMAIL -->
        <mat-form-field appearance="outline">
          <mat-label>Correo</mat-label>
          <mat-icon matPrefix>mail_outline</mat-icon>

          <input matInput type="email" formControlName="email" />

          <mat-error *ngIf="formLogin.get('email')?.hasError('required')">
            El correo es obligatorio
          </mat-error>

          <mat-error *ngIf="formLogin.get('email')?.hasError('email')">
            Correo no válido
          </mat-error>
        </mat-form-field>

        <!-- PASSWORD -->
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock_outline</mat-icon>

          <input matInput type="password" formControlName="password" />

          <mat-error *ngIf="formLogin.get('password')?.hasError('required')">
            La contraseña es obligatoria
          </mat-error>

          <mat-error *ngIf="formLogin.get('password')?.hasError('minlength')">
            Mínimo 8 caracteres
          </mat-error>
        </mat-form-field>

        <!-- BUTTON -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
        >
          Iniciar sesión
        </button>
      </form>

      <p class="cambiar">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    </mat-card-content>
  </mat-card>

  <p class="pie">© GH Autos · Venta de vehículos</p>
</div>
